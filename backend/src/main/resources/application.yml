# This file configures how the backend connects to Postgres, Redis, etc.
server:
  port: 8080

spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/devopsplatform
    username: devuser
    password: devpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # auto-creates/updates tables based on your Student.java entity — fine for dev, not for real prod
    show-sql: true        # prints SQL queries to console, helpful while learning
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

# Actuator: exposes health check + metrics endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
