# SonarQube project configuration.
# Used when running the scanner manually (mvn sonar:sonar) outside Jenkins.
# In Jenkins, these properties are set via the Jenkinsfile + withSonarQubeEnv wrapper.
#
# Manual scan from the backend directory:
#   mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
#       -Dsonar.host.url=http://localhost:9000 \
#       -Dsonar.login=<your-token>

# Unique identifier for this project in SonarQube — must not contain spaces
sonar.projectKey=production-devops-platform

# Display name in the SonarQube dashboard
sonar.projectName=Production DevOps Platform

# Version shown in the SonarQube UI — update when releasing
sonar.projectVersion=0.1.0

# Source code root (relative to project root where this file lives)
sonar.sources=backend/src/main/java

# Test source directory
sonar.tests=backend/src/test/java

# Tell SonarQube where compiled bytecode lives so it can do deeper analysis
sonar.java.binaries=backend/target/classes

# JUnit test reports — SonarQube reads these to show test coverage
sonar.junit.reportPaths=backend/target/surefire-reports

# Exclusions — generated code, build artifacts
sonar.exclusions=**/target/**,**/node_modules/**,**/*.min.js
